[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-kit"
version = "0.1.0"
description = "Offline-first RAG toolkit (BM25, hashed TF-IDF dense, RRF hybrid) with a reproducible evaluation harness and optional Claude answering."
readme = "README.md"
license = "MIT"
authors = [{ name = "Bryant Le" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "anthropic>=2.0", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
rag-eval-kit = "rag_eval_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_eval_kit = ["data/*.jsonl", "data/corpus/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
